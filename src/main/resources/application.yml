spring:
  application:
    name: chat-api
  
  profiles:
    active: dev

# Server configuration
server:
  port: 8081

# gRPC Server
grpc:
  server:
    port: 9090
    enable-reflection: true

# Management/Actuator
management:
  server:
    port: 8081
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# MinIO Object Storage (defaults)
minio:
  endpoint: http://localhost:9000
  external-endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: chat-files
  download-url-expiration-seconds: 3600
  chunk-size-bytes: 5242880

# Logging
logging:
  level:
    com.chat: DEBUG
    org.springframework: INFO
    org.springframework.boot.autoconfigure: DEBUG
    io.grpc: INFO
    io.minio: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      # MinIO file storage circuit breaker
      minio:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        recordExceptions:
          - java.io.IOException
          - io.minio.errors.MinioException
      
      # WhatsApp adapter circuit breaker
      whatsapp:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 30
        slowCallRateThreshold: 40
        slowCallDurationThreshold: 3s
        recordExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
      
      # Instagram adapter circuit breaker
      instagram:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 30
        slowCallRateThreshold: 40
        slowCallDurationThreshold: 3s
        recordExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
  
  # Rate Limiter Configuration
  ratelimiter:
    instances:
      # Message sending rate limiter (100 messages/minute per user)
      sendMessage:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 60s
        timeoutDuration: 0s  # Reject immediately if limit exceeded
        eventConsumerBufferSize: 100
      
      # File upload rate limiter (10 uploads/minute per user)
      fileUpload:
        registerHealthIndicator: true
        limitForPeriod: 10
        limitRefreshPeriod: 60s
        timeoutDuration: 0s
        eventConsumerBufferSize: 50

# Webhook Base URL (for adapter callbacks)
webhook:
  base-url: ${WEBHOOK_BASE_URL:http://localhost:8081}
