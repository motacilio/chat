# Docker Profile Configuration
# Overrides localhost URLs with Docker service names

# MinIO Configuration (Docker)
# Internal endpoint (for Spring Boot -> MinIO communication within Docker network)
minio.endpoint=http://minio:9000
# Public endpoint (for pre-signed URLs accessible from host machine)
minio.public-endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=chat-files
minio.download-url-expiration-seconds=3600
minio.chunk-size-bytes=5242880
