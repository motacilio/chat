# Nome do aplicativo
spring.application.name=chat-api

# Porta onde o servidor gRPC ira escutar
grpc.port=9090

# Spring Boot Actuator (health checks)
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=chat-api-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# MongoDB Configuration (Development - SEM AUTENTICAÇÃO)
spring.data.mongodb.uri=mongodb://localhost:27017/chat

# MinIO Configuration (User Story 4 - P2: File Upload/Download)
# Object Storage for files up to 2 GB with resumable upload protocol
# Use localhost:9000 (works from host AND from container via extra_hosts)
minio.endpoint=http://localhost:9000
minio.external-endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=chat-files
# Download URL expiration: 1 hour (3600 seconds per FR-023)
minio.download-url-expiration-seconds=3600
# Upload chunk size: 5 MB (5242880 bytes per research.md Decision 4)
minio.chunk-size-bytes=5242880

# Logging Configuration (NFR-017)
logging.level.root=INFO
logging.level.com.chat=DEBUG
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Authentication Configuration (POC - see specs/001-ubiquitous-messaging-platform/authentication-jwt-research.md)
# WARNING: Static secret for POC only - MUST use environment variable in production
jwt.secret=chat-api-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000