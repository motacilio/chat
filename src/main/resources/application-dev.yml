spring:
  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/chat
      database: chat
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: message-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false  # Manual offset commits for at-least-once delivery
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 10  # Prefetch limit (backpressure)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all  # Wait for all replicas to acknowledge
    listener:
      ack-mode: manual  # Manual acknowledgment mode

# Security (development - disable OAuth2 for local testing)
spring.security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: http://localhost:8080/realms/chat  # Placeholder for Keycloak

# MinIO Configuration (File Upload - User Story 4 P2)
minio:
  endpoint: http://localhost:9000
  external-endpoint: http://localhost:9000  # URL clients use to upload/download
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: chat-files
  download-url-expiration-seconds: 3600  # 1 hour
  chunk-size-bytes: 5242880  # 5 MB chunks for resumable upload

# Resilience4j Configuration
resilience4j:
  ratelimiter:
    instances:
      sendMessage:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
      default:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s

logging:
  level:
    com.chat: DEBUG
    org.apache.kafka: INFO
    org.springframework.data.mongodb: DEBUG
    io.minio: DEBUG

# Webhook Configuration (Dev/Test)
webhook:
  base-url: http://localhost:8081
  
  # WhatsApp Webhook - Deve coincidir com mock-webhook-sender.js
  whatsapp:
    secret-key: whatsapp-test-secret-key-12345
    verify-token: whatsapp-verify-token-12345
  
  # Telegram Webhook - Deve coincidir com mock-webhook-sender.js
  telegram:
    secret-token: telegram-test-secret-key-12345
